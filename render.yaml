services:
  - type: web
    name: qjo-ai
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20

      # ---- Providers (set the values in the Render dashboard, never in git) --
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

      # ---- Access control ---------------------------------------------------
      # ⚠️ LAUNCH DECISION: `false` means ANY anonymous visitor can call
      # /api/chat and spend your provider credits. It is fine for private
      # testing and wrong for a public launch.
      #
      # Before flipping this to `true` you MUST also set
      # FIREBASE_SERVICE_ACCOUNT_JSON below — otherwise every authenticated
      # route answers 500 ("Server auth verification is not configured") and
      # the whole app looks broken.
      - key: REQUIRE_FIREBASE_AUTH
        value: false

      # Firebase Admin credentials, required when REQUIRE_FIREBASE_AUTH=true.
      # Paste the service account JSON as a single line in the dashboard.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      # Comma-separated emails allowed into /api/admin/* and the dashboard.
      - key: ADMIN_EMAILS
        sync: false

      # ---- Quotas and abuse limits -----------------------------------------
      # 0 = unlimited. Set real numbers before a public launch: these are the
      # only thing standing between a scraper and your provider bill.
      - key: DAILY_USER_LIMIT
        value: 0
      - key: GUEST_DAILY_LIMIT
        value: 0
      - key: IP_RATE_LIMIT_PER_MINUTE
        value: 0

      # ---- Keep-alive (anti spin-down) --------------------------------------
      # Free services sleep after 15 min idle; waking costs the next visitor
      # ~50-60s. The in-app pinger keeps a running service awake.
      #
      # CONFIGURED 24/7 BY REQUEST: START_HOUR == END_HOUR means no window, so
      # the pinger runs around the clock and the service never sleeps.
      #
      # ⚠️ Budget: 24 * 31 = 744 h against Render's 750 free instance-hours per
      # WORKSPACE per month -- a 6 h margin in the seven 31-day months (30-day
      # months are 720 h, a comfortable 30 h margin). This is safe ONLY while
      # this is the only free service in the workspace. Adding a second one
      # exhausts the pool, and Render then SUSPENDS every free web service
      # until the 1st. Watch Dashboard > Billing > Monthly Included Usage.
      #
      # Note: the in-app pinger cannot wake a service that ALREADY slept (it
      # dies with the process), so the external pinger is what guarantees
      # always-on -- see docs/RENDER_KEEP_AWAKE.md.
      - key: KEEP_ALIVE_ENABLED
        value: true
      - key: KEEP_ALIVE_START_HOUR
        value: 0
      - key: KEEP_ALIVE_END_HOUR
        value: 0
      - key: KEEP_ALIVE_TIMEZONE
        value: Asia/Amman

      # ---- Proxy awareness --------------------------------------------------
      # Render sets RENDER=true, which the server auto-detects to trust exactly
      # one proxy hop. Only set TRUST_PROXY explicitly if another CDN
      # (e.g. Cloudflare) sits in front of Render — then use 2. Getting this
      # wrong lets clients forge X-Forwarded-For and bypass per-IP quotas.
      # - key: TRUST_PROXY
      #   value: 1
