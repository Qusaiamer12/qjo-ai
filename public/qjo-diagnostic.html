<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
  <title>Qjo Diagnostic</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" defer></script>
  <style>
    :root{color-scheme:dark;--bg:#07101f;--card:#0f172a;--card2:#111c31;--text:#f8fafc;--muted:#94a3b8;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--line:rgba(148,163,184,.22);--accent:#38c7dd}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#123b7a55,transparent 34%),var(--bg);color:var(--text);line-height:1.6}
    .wrap{width:min(1080px,100%);margin:auto;padding:24px}.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:16px;background:#fff url('/icon-192.png') center/cover no-repeat;box-shadow:0 20px 60px #38c7dd22}h1{margin:0;font-size:clamp(24px,4vw,38px)}p{color:var(--muted);margin:6px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.08);color:var(--text);padding:10px 14px;text-decoration:none;cursor:pointer;font-weight:750}button.primary{background:linear-gradient(135deg,#123b7a,#7b3fe4);border:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(15,23,42,.94),rgba(15,23,42,.78));border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 18px 60px rgba(0,0,0,.22)}.card h2{font-size:16px;margin:0 0 12px}.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid rgba(148,163,184,.12)}.row:first-of-type{border-top:0}.dot{width:10px;height:10px;border-radius:999px;margin-top:8px;background:var(--warn)}.ok .dot{background:var(--ok)}.bad .dot{background:var(--bad)}.warn .dot{background:var(--warn)}.name{font-weight:760}.detail{font-size:12px;color:var(--muted);direction:ltr;text-align:left;overflow-wrap:anywhere}.status{font-size:12px;font-weight:800}.ok .status{color:var(--ok)}.bad .status{color:var(--bad)}.warn .status{color:var(--warn)}pre{direction:ltr;text-align:left;white-space:pre-wrap;background:#020617;border:1px solid var(--line);border-radius:16px;padding:12px;max-height:360px;overflow:auto}.wide{grid-column:1/-1}.small{font-size:12px;color:var(--muted)}@media(max-width:760px){.wrap{padding:14px}.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.actions{width:100%}button,a.btn{flex:1;text-align:center}.card{border-radius:18px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="brand"><div class="logo"></div><div><h1>Qjo Diagnostic</h1><p>فحص سريع للنسخة، السيرفر، البحث، Firebase، والموقع/الوقت.</p></div></div>
      <div class="actions"><button class="primary" id="runBtn">تشغيل الفحص</button><a class="btn" href="/" target="_self">رجوع لـ Qjo</a></div>
    </section>
    <section class="grid">
      <div class="card"><h2>Core</h2><div id="core"></div></div>
      <div class="card"><h2>Firebase/Auth</h2><div id="auth"></div></div>
      <div class="card"><h2>APIs</h2><div id="apis"></div></div>
      <div class="card"><h2>Client Context</h2><div id="ctx"></div></div>
      <div class="card wide"><h2>Raw Report</h2><pre id="raw">اضغط تشغيل الفحص...</pre><div class="small">ملاحظة: فحص Firestore write يحتاج تسجيل دخول فعلي في نفس المتصفح.</div></div>
    </section>
  </main>
<script>
const firebaseConfig={apiKey:"AIzaSyBo902a2kkFRla-asU2nAzFkBaDW7yJTVI",authDomain:"qjo1-8ae37.firebaseapp.com",projectId:"qjo1-8ae37",storageBucket:"qjo1-8ae37.firebasestorage.app",messagingSenderId:"549387435430",appId:"1:549387435430:web:563fd4dcb108f360eb6367",measurementId:"G-J5RGLP3EG5"};
const $=id=>document.getElementById(id); const report=[];
function row(root,name,state,detail=''){const cls=state==='ok'?'ok':state==='bad'?'bad':'warn'; const txt=state==='ok'?'OK':state==='bad'?'FAIL':'WARN'; root.insertAdjacentHTML('beforeend',`<div class="row ${cls}"><span class="dot"></span><div><div class="name">${name}</div><div class="detail">${String(detail||'')}</div></div><div class="status">${txt}</div></div>`); report.push({name,state,detail});}
async function getJson(url,opts){const t=Date.now(); try{const r=await fetch(url,{cache:'no-store',...opts}); const data=await r.json().catch(()=>({})); return {ok:r.ok,status:r.status,ms:Date.now()-t,data};}catch(e){return {ok:false,status:0,ms:Date.now()-t,error:e.message};}}
async function run(){report.length=0; ['core','auth','apis','ctx'].forEach(id=>$(id).innerHTML=''); $('raw').textContent='Running...';
 const core=$('core'), auth=$('auth'), apis=$('apis'), ctx=$('ctx');
 row(core,'Page loaded','ok',location.href); row(core,'Network online',navigator.onLine?'ok':'bad',navigator.onLine?'online':'offline'); row(core,'Viewport','ok',`${innerWidth}x${innerHeight}`);
 const health=await getJson('/api/health'); row(core,'/api/health',health.ok?'ok':'bad',health.ok?`${health.data.version} — ${health.ms}ms`:JSON.stringify(health));
 row(core,'Backend proxy feature',health.data?.features?.backendProxy?'ok':'bad'); row(core,'Search feature',health.data?.features?.deepSearch?'ok':'bad');
 const appJs=await fetch('/app.js?diag='+Date.now(),{cache:'no-store'}).then(r=>r.text()).catch(e=>''); row(core,'Frontend JS reachable',appJs.includes('QJO_FRONTEND_VERSION')?'ok':'bad',appJs.match(/QJO_FRONTEND_VERSION = '([^']+)'/)?.[1]||'not found');
 row(auth,'Firebase SDK loaded',window.firebase?'ok':'bad');
 if(window.firebase){try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig); const a=firebase.auth(); row(auth,'Firebase app initialized','ok',firebase.app().options.projectId); row(auth,'Auth current user',a.currentUser?'ok':'warn',a.currentUser?`${a.currentUser.email||a.currentUser.uid}`:'No active user on this diagnostic page'); try{await a.setPersistence(firebase.auth.Auth.Persistence.LOCAL); row(auth,'Auth persistence LOCAL','ok');}catch(e){row(auth,'Auth persistence LOCAL','bad',e.message)} if(a.currentUser){try{await firebase.firestore().collection('users').doc(a.currentUser.uid).get(); row(auth,'Firestore user doc read','ok');}catch(e){row(auth,'Firestore user doc read','bad',e.message)}} else row(auth,'Firestore write/read','warn','Login first in Qjo, then re-run diagnostic.');}catch(e){row(auth,'Firebase init','bad',e.message)}}
 const client=await getJson('/api/client-context'); row(ctx,'/api/client-context',client.ok?'ok':'bad',client.ok?`${client.data.ipGeoAvailable?'geo available':'geo unavailable'} — ${client.ms}ms`:JSON.stringify(client)); if(client.ok){row(ctx,'Server time','ok',client.data.serverTime); row(ctx,'IP geo',client.data.ipGeoAvailable?'ok':'warn',client.data.ipGeo?JSON.stringify(client.data.ipGeo):client.data.note)} row(ctx,'Browser timezone','ok',Intl.DateTimeFormat().resolvedOptions().timeZone||'unknown'); row(ctx,'Browser time','ok',new Date().toString());
 const search=await getJson('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:'World Cup 2026 final date official source'})}); row(apis,'/api/search',search.ok?'ok':'bad',search.ok?`${(search.data.results||[]).length} results — ${search.data.provider} — ${search.ms}ms`:JSON.stringify(search));
 const deep=await getJson('/api/deep-search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:'World Cup 2026 final date official sources'})}); row(apis,'/api/deep-search',deep.ok?'ok':'bad',deep.ok?`${(deep.data.results||[]).length} results — ${deep.data.searchProvider} — ${deep.ms}ms`:JSON.stringify(deep));
 const chat=await getJson('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'normal',messages:[{role:'user',content:'رد بكلمة تمام فقط'}],max_tokens:20,temperature:.1})}); row(apis,'/api/chat',chat.ok?'ok':'bad',chat.ok?`${chat.data.provider||'provider?'}: ${chat.data.answer||''} — ${chat.ms}ms`:JSON.stringify(chat));
 $('raw').textContent=JSON.stringify({generatedAt:new Date().toISOString(),report,health:health.data,clientContext:client.data},null,2);
}
$('runBtn').addEventListener('click',run); window.addEventListener('load',()=>setTimeout(run,400));
</script>
</body>
</html>
