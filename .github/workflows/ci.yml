name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # --ignore-scripts skips Puppeteer's Chromium download (~150MB). Nothing
      # in lint or the smoke test launches a browser; the PDF export path that
      # needs Chromium is exercised in the deploy-verify eval, not here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Runs before everything else: a leaked credential is the one failure
      # that cannot be fixed by a follow-up commit.
      - name: Secret scan
        run: npm run scan-secrets

      - name: Lint
        run: npm run lint

      - name: Smoke test
        run: npm test

      - name: Stability audit
        run: npm run audit

      # JSDoc annotations checked by the TypeScript compiler. noEmit: this never
      # produces output, so the files that ship stay the files that are written.
      # It found three real defects on the day it was switched on.
      # Pure front-end logic, tested without a browser. These branches used to
      # live inside a 588-line function, where checking one meant triggering it
      # in a real browser.
      - name: Front-end domain suite
        run: npm run test:domain

      - name: Type check
        run: npm run typecheck

      # A ratchet on file size: a watched file may shrink, never grow. Quality
      # rules that fail on day one get switched off on day two, so every budget
      # is set at what the code does today and lowered as it improves.
      - name: Structure budgets
        run: npm run structure

      # Search had three faults with one root cause: a keyword cascade decided
      # whether to search, before the message was sent, with no bound on how
      # long that took. These assert the model gets the choice, the results
      # arrive as citable evidence, and nothing can stall the message.
      - name: Search behaviour suite
        run: npm run test:search

      # "It decides to search, then it just stops." Real llmService and
      # RoutingEngine against a fake provider over real HTTP: headers then
      # silence, keys that all stall, a search that never returns, every model
      # failing after a search. Each case has a watchdog, so a hang fails with
      # its name instead of holding the job until it times out.
      - name: Search end-to-end suite
        run: npm run test:search-e2e

      # The route over real HTTP: keep-alives while the answer is prepared, an
      # error event when something throws mid-stream, and a sources-only
      # fallback that is never cached.
      - name: Chat route suite
        run: npm run test:route

      # The agent loop is what separates this from a chat box: the model must be
      # able to act on what it just learned, and the loop must stay bounded.
      - name: Agent loop suite
        run: npm run test:agent

      # Long tasks run as steps over stored state, so the assertions that matter
      # are the ones that restart the world between steps: nothing may live in a
      # variable that a deploy would take with it.
      - name: Task runner and workspace suite
        run: npm run test:tasks

      # fetch_page opens URLs a model chose from text a model read, so its SSRF
      # guards are the most security-sensitive assertions in the repo.
      - name: Page fetch and SSRF suite
        run: npm run test:fetch

      # Failure modes that take the whole service down rather than one request:
      # a context-length rejection used to cool down every API key on every
      # provider, and the history trim silently deleted a third of the evidence
      # retrieval had just selected.
      - name: Resilience and context-budget suite
        run: npm run test:resilience

      # The router picks the system overlay an answer is written under, so a
      # misclassification degrades the answer silently instead of failing. A
      # pasted CV was being routed to the coding agent because of its contents.
      - name: Routing classification suite
        run: npm run test:routing

      # Streaming assembles the answer from fragments, so a sanitizer that is
      # correct for a whole message can still be wrong for a chunk — that is how
      # every word in every answer shipped glued to the next one.
      - name: Streaming integrity suite
        run: npm run test:stream

      # Asserts the HTML the PDF renderer is built from: math, images, lists,
      # bidi isolation and self-containment. Every export defect so far has
      # lived there and none of it is visible from an endpoint response.
      - name: PDF export suite
        run: npm run test:pdf

      # Resolves every relative require() in server.js + src/ so a module that
      # moves or is deleted fails here instead of at boot on Render.
      - name: Module resolution check
        run: node scripts/check_deps.js

      # Boots the server and asserts the public JSON endpoints behave. This is
      # the check that catches a route handler calling an injected dependency
      # the server never passed (which is how /api/status started 500ing).
      - name: Backend regression eval
        run: |
          PORT=4123 npm start &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4123/api/health > /dev/null && break
            sleep 1
          done
          QJO_BASE_URL=http://127.0.0.1:4123 npm run backend-regression

      # Advisory only: the remaining findings sit in transitive deps of
      # firebase-admin/puppeteer and need major upgrades, so a hard failure
      # here would block every unrelated PR.
      - name: Security audit (advisory)
        run: npm audit --audit-level=high || true

  # Everything above runs in Node. These drive the real page in a real Chromium
  # against a real server: streaming into the DOM, the boot guard, sign-in on a
  # Safari-like storage model, the task UI, XSS in rendered answers. They lived
  # in a scratch directory until they were nearly lost with it.
  #
  # Their own package (tests/browser/package.json) so that Render's production
  # install never pulls in Playwright. Every context is isolated to the app's
  # origin, so a CDN being up or down cannot change a result here.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Node 20 is what Render runs; the server under test is started with the
      # same Node as the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/browser/package-lock.json

      - name: Install app dependencies
        run: npm ci --ignore-scripts

      - name: Install browser test dependencies
        run: npm ci --prefix tests/browser --ignore-scripts

      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Browser suites
        run: npm run test:browser
